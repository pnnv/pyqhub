<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PYQ Hub</title>
    <meta name="description" content="Previous year question papers for NITK Surathkal, by branch, year and course." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead" id="masthead"></header>
    <main id="main" class="sheet" tabindex="-1"></main>
    <footer class="footer">
      <div class="footer-inner">
        <p>PYQ Hub is run by students of NITK Surathkal. Every paper is checked by an admin before it goes up.</p>
        <p><a href="/upload">Upload a paper you have</a></p>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
